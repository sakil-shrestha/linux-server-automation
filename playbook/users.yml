---
- name: " linux server automation"
  hosts: automationserver
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: " create users and group"
      user:
        name: "{{item.name}}"
        groups: "{{item.groups}}"
        create_home: yes
        shell: "{{item.shell}}"
        state: present
      loop: "{{admin_users}}"