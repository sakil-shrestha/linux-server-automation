---
- name: "install and update packages"
  hosts: automation
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks: 
    - name: " update packages "
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "upgrade package"
      apt:
        upgrade: dist

    - name: "intallation of packages"
      ansible.builtin.apt:
        name: "{{common_packages}}"

        state: present