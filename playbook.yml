---
- name: " linux server automation"
  hosts: automationserver
  become: true
  tasks:

   - name: " update packages "
     ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600

   - name: "upgrade package"
     apt:
        upgrade: dist

   - name: "intallation of packages"
     ansible.builtin.apt:
        name: 
          - git
          - curl
          - nginx
          - htop
          - unzip
          - wget

        state: present

   - name: "create users and group"
     user:
       name: devops   # name of the user 
       groups: sudo # group of the user
       append: true # append the user to the group
      #  password: "#asfwee303!2fsdfscsd" # set the password for the user in hash
       create_home: true # this will create the home directory for the user
       shell: /bin/bash # set the shell
       state: present


